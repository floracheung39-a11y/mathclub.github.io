    70: "老虎和猎豹进行百米赛跑。老虎一步可以跨出2米，猎豹一步可以跨出3米，老虎跨出4步的时间里猎豹只能跨出3步，那么____先到达终点。\n答案：猎豹",

    74: "在367个七岁的小朋友中，至少有____个小朋友在同一天过生日。\n答案：2",

    79: "小朋友们在操场上做操，小军站在左边第3列，右边第3列；从前数是第3个，从后数是第3个。如果每行的人数相同，那么一共有____个小朋友在做操。\n答案：120",

    88: "移动一根火柴棒，使等式成立。24-7+2-1=4\n答案：24-7-2-1=14 或 24-7-2-11=4 或 24-17-2-1=4 或 24-7-12-1=4",

    94: "小童、小林、小超、小奇四人每人手里拿着一块积木，有红色圆形的、红色方形的、蓝色圆形的、蓝色方形的。只知道：①小童拿的是圆形的；②小林与小童拿的都是红色的；③小超和小林拿的都是方形的。____拿的积木是蓝色圆形的。\n答案：小奇",
    95: "小王、小丁和小田三人中，一位是工人，一位是农民，一位是士兵，而且小田比士兵年龄大，小王和农民不同岁，农民比小丁年龄小。则____是工人，____是农民，____是士兵。\n答案：小丁，小田，小王",
    96: "娟娟、玲玲、婷婷、佳佳4人画了4只鸡，有黑公鸡、白公鸡、黑母鸡、白母鸡，每人画1只，玲玲和娟娟画的鸡都是黑色的，婷婷和娟娟画的都是母鸡，那么白公鸡是（）画的。\n答案：D",
    97: "一个岛上，有A，B两个村庄，A村的人总说谎话，B村的人总说真话，两村的人可以相互来往。一个外地人到了这个岛，但不知到了哪个村庄。他问一位老大爷：“请问你是这个村庄的人吗？”老大爷回答：“不是”。那么外地人在____村。\n答案：A",
    98: "一天，唐僧师徒四人来到一家小店，店主和小伙计一见悟空兄弟相貌可怕，吓得都跑了，师徒四人只能自己动手做饭，他们一个挑水，一个洗菜，一个烧火，一个淘米。现在知道：①唐僧不挑水也不淘米；②悟空不洗菜也不挑水；③如果悟空不淘米，那么沙僧就不挑水；④八戒既不挑水也不洗菜。那么师徒四人干的活分别是唐僧____；悟空____；沙僧____；八戒____。\n答案：洗菜，淘米，挑水，烧火",
    99: "小丁说：“3月13日是星期五。”小巧说：“3月11日是星期日。”小胖说：“小丁和小巧说的都不对。”小亚说：“3月12日不是星期六。”如果他们四人中只有一人的话是对的，那么3月12日是星期____\n答案：六",
    100: "一颗花生米和一颗杏仁都是整数克，两颗花生米比一个杏仁重，两颗杏仁比三颗花生米重，一颗花生米和一颗杏仁总共不到10克，那么一颗杏仁和一颗花生米共重____克。\n答案：8"

    94: "有四个人在晚上准备通过一座摇摇欲坠的小桥。此桥每次只能让2个人同时通过，否则桥会倒塌。过桥的人必须要用到手电筒，不然会一脚踏空。只有一个手电筒。4个人的行走速度不同：甲用1分钟就可以过桥，乙要2分钟，丙要5分钟，丁需要10分钟。4个人要全部安全过桥至少需要____分钟。\n答案：17",

    97: { text: "下图所示靶子中的9，7，5，3，1分别是打中该区域所得的分数。甲说：我打了6枪，每枪都中靶了，共得了27分。乙说：我只打了3枪，都中靶了，也得了27分。两个人中有一个人说了谎话，则说谎话的是____\n答案：甲", img: "images/2024_97.png" },
    98: "小兔、小猴、小猪和小狗四只小动物赛跑，小兔跑得比小狗慢，比小猪快；小猴比小兔跑得快，比小狗跑得慢。第一名到第四名依次是____\n答案：小狗、小猴、小兔、小猪",
    99: "动物王国正在进行百米赛跑。比赛后，斑马、袋鼠、大象说了以下几句话，长颈鹿没有说话。斑马：大象是第一名，我是第三名；袋鼠：我是第一名，长颈鹿是第四名；大象：长颈鹿是第二名，我是第三名。比赛成绩公布后，成绩没有并列情况，发现它们都只说对了一半，由此可以推断袋鼠是第____名。\n答案：一",

    30: "个位数字比十位数字大的两位数有____个。\n答案：36",
    31: "各位数字之和等于34的四位数共____个。\n答案：10",
    32: "用0,1,2,3这四个数字可以组成____个没有重复数字的四位偶数。\n答案：10",
    33: "外星人来到地球上，随身带有本星球上的硬币1分、2分、4分、8分各3枚，如果他想买9分钱的一件商品，他有____种付款方式。\n答案：5",
    34: "将2只红色灯泡和4只黄色灯泡从上到下放成一串，可以组成____个不同的灯光信号。\n答案：15",
    35: "4个男同学和3个女同学进行乒乓球单打比赛，如果每个男同学和每个女同学之间都打1盘，一共要打____盘。\n答案：12",
    36: "小虎给3个小朋友写信，由于粗心，把信装入信封时都给装错了，结果3个小朋友收到的都不是给自己的信，小虎装错的情况共有____种可能。\n答案：2",
    37: "小希给4个好朋友写信。由于粗心，在把信纸装入信封时都给装错了。4个好朋友收到的都是给别人的信。小希装错的情况共有____种可能。\n答案：9",
    38: { text: "下图中有6个点，9条线段，一只甲虫从A点出发，要沿着图中线段爬到F点。行进中甲虫只能向右、向下或向右下方爬行。这只甲虫有____种不同的走法。\n答案：5", img: "images/2025培训_38.png" },
    39: "有两个鸡笼，第一笼比第二笼多21只鸡，把第一笼中的____只鸡移到第二笼后，第二笼比第一笼多3只鸡。\n答案：12",
    40: "妈妈买回两筐鸡蛋，第一筐里有91个，第二筐里有19个，每次从鸡蛋多的一筐中取出9个放到鸡蛋少的一筐中，需要拿____次才能使两筐鸡蛋数量相等。\n答案：4",
    41: "小青有两盒糖，甲盒有糖78粒，乙盒有糖38粒，每次从甲盒取5粒糖放到乙盒中，取____次两盒糖的粒数就同样多。\n答案：4",
    42: "哥哥有20支铅笔，哥哥给弟弟4支后，兄弟俩的铅笔一样多，弟弟原来有____支铅笔。\n答案：12",
    43: "小林家有大、小两个鱼缸，原来两个鱼缸里的金鱼条数相等，如果从小鱼缸里拿4条放到大鱼缸里，这时大鱼缸里的金鱼条数是小鱼缸里的2倍，小鱼缸里原来有鱼____条。\n答案：12",
    44: "如果10只兔子可以换2只羊，9只羊可以换3只猪，8只猪可以换2头牛，那么2头牛可以换____只兔子。\n答案：120",
    45: "猴子摘桃，第一天摘了树上桃子的一半，第二天又摘了余下桃子的一半多1个，这时树上还有9个桃子，原来树上有____个桃子。\n答案：40",
    46: "有一堆棋子，每次从中拿走一半，再放回去1枚，这样3次后还剩4枚棋子，原来有____枚棋子。\n答案：18",
    47: "操场上原有16个同学，又来了14个。这些同学每5个一组做游戏，可以分成____组。\n答案：6",
    48: "大明、小荣、豆豆三个小朋友去称体重，大明和小荣一起称是55千克，大明和豆豆一起称是49千克，小荣和豆豆一起称是56千克。三人的体重各是多少千克？\n答案：24，31，25",
    49: "有5盒巧克力，每盒装的块数一样多，如果从每个盒子拿出6块，那么这5盒里剩下的巧克力的总块数刚好等于原来2个盒子里的巧克力的总块数。原来每个盒子装了____块巧克力。\n答案：10",
    50: "小明用一根绳子测量一口枯井有多深。他把绳子放入井里，当绳子到达井底后，井外还留有12米。小明又把这根绳子对折后再放入井里，井外还留有2米。那么这根绳子长____米。\n答案：20",
    51: "奶奶家有6个鸡蛋，还养了一只一天能下一个鸡蛋的老母鸡，如果她家一天吃2个鸡蛋，奶奶家的鸡蛋能连续吃____天。\n答案：6",
    52: "一个大信封里面放5个中等的信封，每个中等的信封里又放6个小信封，一共有____个信封。\n答案：36",
    53: "王大妈家有一号、二号、三号三个米桶，里面一共有米48千克。王大妈从一号桶内称出8千克米放入二号桶，又从二号桶内称出6千克米放入三号桶，这时三个桶内的米重量正好相等。原来一号桶内有米____千克。\n答案：24",
    54: "阿拉丁在藏宝库里发现了20条项链，有的项链上有2颗钻石，有的项链上有5颗钻石，一共79颗钻石。那么5颗钻石的项链有____条。\n答案：13",
    55: "小红将50个玻璃球装入大小不同的两种盒子里，每个大盒子装9个，每个小盒子装4个，全部装完一共用了10个盒子。大盒子用了____个，小盒子用了____个。\n答案：2；8",
    56: "明年小强就要庆祝20岁生日了，而小美前年刚过了她的7岁生日。他们两家的父母相约20年后再见面，到那时，小强比小美大____岁。\n答案：10",
    57: "书架上有五层书，其中有两层放的是故事书，另外三层放的是漫画书。这五层书的数量分别是：3，4，5，7，8。已知漫画书的总数是故事书总数的2倍，那么故事书有____本。\n答案：9",
    58: "体育课上老师让大家站成一排开始报数：1，2，3，……队伍中共有33个学生，老师让报偶数的学生蹲下。小高是站着的，并发现自己是站着的学生中最中间的一个。小思是蹲着的，并且是倒着数第7个蹲着的。那么小高和小思之间有____个学生。\n答案：2",
    59: "草原上有小马和小羊共36只。如果把小马放到4片草地上，把小羊放到另外5片草地上，这样每片草地上的动物只数相等，那么小马有____只。\n答案：16",
    60: "在一条长45米的公路两边种树，两端都种，共种了20棵树，那么每隔____米种一棵（树的宽度忽略不计）。\n答案：5",
    61: "两座楼房之间相距40米，每隔4米栽一棵雪松，一共能栽____棵雪松。\n答案：9",
    62: "在一条长24米的公路一侧种树，每隔4米种一棵，一端种一端不种，一共能种____棵树（树的宽度忽略不计）。\n答案：6",
    63: "小明与同班同学正在进行队列训练，开始时排成了一个正方形方阵，小明左边有2个人，右边有3个人，正前方有2个人，正后方有3个人。之后所有同学进行队列变换，排成了一个新的长方形队伍，这时小明发现他左边有4个人，右边有4个人，正前方有1个人，那么这时他的正后方有____个人。\n答案：2",
    64: "爱丽把10厘米长的便条贴粘成一条，重叠的地方长2厘米，得到长210厘米的长便条贴，她用了____张便条贴。\n答案：26",
    65: "树袋熊丫丫在爬一棵10米高的大树，每爬10分钟累了休息2分钟再继续爬，在这10分钟里它能向上爬2米，那么丫丫要____分钟才能爬到树顶。\n答案：58",
    66: "小明从家到学校，第一天步行去、步行回，第二天骑车去、骑车回。他发现第一天从家去学校的时间等于他第二天路上所用的总时间。第三天他骑车去、步行回，共用了15分钟，那么他第一天路上一共用了____分钟。\n答案：20",
    67: "若某年的1月份有5个星期日，6月份有5个星期六，则这一年的11月20日是星期____\n答案：二",
    68: "广场上摆满花，这些花是按3盆红色、2盆黄色的顺序依次摆放的，第2025盆是____色。\n答案：红",
    69: "把1，2，3，4填入下面四个口中，使算式的和最小，这个和是____\n答案：37",
    70: "一个三位数的各位数字之和是16，并且各位上的数字不相同，这个三位数最小是____\n答案：169",
    71: "找规律填数：1，1，2，4，3，9，4，16，5，25，6，36，……，____，10，100。\n答案：81",
    72: "按规律填数：15，11，13，13，11，15，9，17，7，____，5，21，3。\n答案：19",
    73: { text: "如图，观察前面两个正方形中数各之间的关系，根据规律，第三个正方形中“？”代表的数是____\n答案：9", img: "images/2025培训_73.png" },
    74: { text: "？处填什么样的图形？____\n答案：略", img: "images/2025培训_74.png" },
    75: "天天在假期做作业，他每逢星期一、星期六、星期日就要做2道数学题，其他时间做语文题，已知天天在连续31天的时间里共做了30道数学题，那么这连续31天的第一天是星期____\n答案：六",
    76: "小熊家仓库里原有50根玉米棒。第一天它摘来了20根玉米棒，但被老鼠偷了1根；第二天它摘来了19根，但被老鼠偷了2根；第三天它摘来了18根，但被老鼠偷了3根；……，依次类推，小熊每天都比前一天少摘来1根，但老鼠每天都比前一天多偷1根。那么过了19天以后，小熊还有____根玉米棒。\n答案：69",
    77: "哥哥和弟弟都有一些糖，哥哥比弟弟多10块，哥哥每给弟弟2块，弟弟就要吃掉1块，当某次弟弟吃完1块糖后，弟弟比哥哥多2块，这时哥哥已经给了弟弟____块。\n答案：8",
    78: "把15个苹果分成4份，每份苹果的数量各不相同，数量最多的一份最少有____个苹果。\n答案：6",
    79: "将52个球分别装入一些盒子中，要求每个盒子里球的数量各不相同，并且没有空盒子。那么最多需要____个盒子。\n答案：9",
    80: "给下面每个小方格涂上一种颜色，颜色从红黄蓝三种颜色中随机选择，若无论怎么涂色，总有两列方格的涂色方法完全相同，则下面的方格至少有____列。\n答案：28",
    81: "将一根长16厘米的绳子对折再对折，然后从一端开始，每隔1厘米剪一刀，最后可以得到____根长为2厘米的绳子。\n答案：3",
    82: { text: "桌上有10个甜甜圈，编号1~10。从1号甜甜圈开始吃，按顺时针方向，每隔两个吃一个，6号甜甜圈是第____个吃到的。\n答案：7", img: "images/2025培训_82.png" },
    83: "社区居民要从甲乙丙三名候选人中选出一人当管理员。一共有60人参与投票。目前，甲获得20票，乙获得15票，丙获得9票。如果甲要确保获胜，至少需要再获得____票。\n答案：6",
    84: "黑板上写着11~49，李老师每次擦掉2个数，并将它们的差（若两数不同则大数减小数）写在黑板上，当黑板上只剩一个数时，这个数最小是____\n答案：0",
    85: "商店里有各式各样的笔，价钱也都不一样。小明买了1根2元的，2根3元的，3根4元的，……，8根9元的。小红买了1根1元的，2根2元的，3根3元的，……，8根8元的。小明比小红多花了____元钱。\n答案：36",
    86: { text: "下面的图形，要求画过的线段不重复画，最少要____笔才能画出。\n答案：5", img: "images/2025培训_86.png" },
    87: { text: "画出下图，至少需要____笔。（不能重复画同一条线）\n答案：5", img: "images/2025培训_87.png" },
    88: { text: "下图是某个儿童乐园的平面图，猪猪侠从I口进去，要使他不重复地走遍儿童乐园的每一条路，他应该在____口出。\n答案：E", img: "images/2025培训_88.png" },
    89: "如图，左边有10枚棋子，右边有12枚棋子，甲乙两人轮流取，每次只能在其中任意一堆里取，每次可以取1至12枚，谁最后取完为胜。如果甲先取，甲应该在右边这堆先取____枚，才能保证自己获胜。\n答案：2",
    90: "盒子里有红球和黄球各8个，最少摸出____个球，才能保证摸出两种颜色不相同的球。\n答案：9",
    91: "赛马比赛前，5位观众对A、B、C、D、E五匹马预测名次。甲说：B第二、C第五；乙说：E第四、D第五；丙说：A第一、E第四；丁说：C第一、B第三；戊说：A第三、D第四。结果每个名次都有人猜中。通过判断知道，A是第____名。\n答案：3",
    92: "懒羊羊说：“我有一些水果，只有2个不是苹果，只有2个不是香蕉，只有2个不是桃，请问：懒羊羊共有____个水果。\n答案：3",
    93: "甲乙丙三人中有一人是牧师，有一人是骗子，还有一人是赌徒。牧师从不说谎，骗子总是说谎，赌徒有时说真话有时说谎话。甲说：“我是牧师。”乙说：“我是骗子。”丙说：“我是赌徒。”那么牧师是____\n答案：甲",
    94: "小巧、小亚、小兰所在的学校分别是一中、二中、三中，各自喜爱游泳、篮球、排球中的一项。现在知道：（1）小巧不在一中，小亚不在二中；（2）爱好排球的不在三中，爱好游泳的在一中；（3）小亚不喜欢游泳。小巧所在的学校是____中，喜爱的运动是____\n答案：二，排球",
    95: "小明、小利和小强三个人轮流进行乒乓球比赛。先由小明和小利两人开始比赛，小强做裁判。一场比赛结束后，失败的人去做裁判，获胜的人继续和小强进行下一场比赛。照这样每场比赛结束后，失败的人都去做裁判，获胜的人继续和刚才做裁判的人进行下一场比赛。最终，小明共比了5场，小利共比了4场，小强共比了3场，已知最后一场比赛是小利胜了小强，那么第五场获胜的是____\n答案：小利",
    96: { text: "小黑和小白拿了一个骰子玩游戏，他们每人扔两次骰子，并且扔出的四次点数都不相同。小黑扔出的两个点数加起来是6，小白扔出的两个点数加起来是5。小黑扔出的点数是（）。\n答案：A", img: "images/2025培训_96.png" },
    97: { text: "小兵和小军用玩具枪玩打靶游戏，如图所示。他们每人打了两发子弹，小兵共打中6环，小军共打中5环，又知没有哪两发子弹打到同一环带内，并且弹无虚发。小军打中的是____环。\n答案：2环和3环", img: "images/2025培训_97.png" },
    98: "有49名探险队员过一条小河，河上只有一条可以乘坐7人的橡皮艇，过一次河需要3分钟（来回算2次），全体队员渡到河对岸一共需要____分钟。\n答案：45",
    99: "有28名学生去野营，他们途中要过一条河，且河边只有一条空木船，这条船最多只能坐4人，这些人要全部到达河对面，最少需要渡河____次。（从河的一边到另一边称为一次渡河）\n答案：17",
    100: "河边有一条空船，现在有3个大人和4个小孩要坐船过河。这条船每次最多能承载的客人情况有3种：①2个大人；②1个大人和2个小孩；③4个小孩。无论大人还是小孩，每个人都会划船。这些人要全部坐船过河，最少需要划船过河____次（一来一回算两次）。\n答案：5"
  },

    12: "将30颗玻璃球放入3个盒子中，第一个盒子和第二个盒子共有18颗球，第二个盒子和第三个盒子共有19颗球。第三个盒子中有____颗球。\n答案：12",

  const saved=localStorage.getItem(STORAGE_KEY);

// ============ 工具函数 ============
function normalize(s){return String(s).replace(/\s+/g,'').replace(/[，,、；;]/g,',').replace(/[（(]/g,'(').replace(/[）)]/g,')').toLowerCase();}
function isAnswerMatch(user,standard){
  const u=normalize(user),s=normalize(standard);
  if(!u||!s)return false;
  if(u===s)return true;
  const uNums=u.match(/\d+/g)||[],sNums=s.match(/\d+/g)||[];
  if(uNums.length>0&&sNums.length>0&&uNums.join(',')===sNums.join(','))return true;
  if(s.includes(u)&&u.length>=s.length*0.7)return true;
  if(u.includes(s)&&s.length>=u.length*0.7)return true;
  return false;
}

// ============ 统计 ============
const allQuestions=[];
for(const year in questionDB){for(const q in questionDB[year])allQuestions.push({year,q:parseInt(q)});}
const totalQuestions=allQuestions.length;

function updateStats(){
  let correct=0,wrong=0,unanswered=0;
  allQuestions.forEach(({year,q})=>{
    const st=answerState[`${year}_${q}`];
    if(!st)unanswered++;else if(st.status==='correct')correct++;else wrong++;
  });
  document.getElementById('statCorrect').textContent=correct;
  document.getElementById('statWrong').textContent=wrong;
  document.getElementById('statUnanswered').textContent=unanswered;
  document.getElementById('statScore').textContent=correct;
  const sd=document.getElementById('scoreDisplay');
  if(correct===totalQuestions){
    sd.textContent=`🎉 100分！全部答对！(${correct}/${totalQuestions})`;
    sd.style.background='#dcfce7';sd.style.color='#16a34a';
  }else{
    sd.textContent=`${correct} / ${totalQuestions} 分`;
    sd.style.background='#eef2ff';sd.style.color='#4F46E5';
  }
  document.querySelectorAll('.q-item').forEach(el=>{
    const y=el.getAttribute('data-year'),q=el.getAttribute('data-q');
    if(!y||!q)return;
    const st=answerState[`${y}_${q}`];
    el.classList.remove('correct','wrong');
    if(st&&st.status==='correct')el.classList.add('correct');
    else if(st&&st.status==='wrong')el.classList.add('wrong');
  });
}

const CX=250,CY=250,R=130;
const entries=Object.entries(data).sort((a,b)=>b[1].count-a[1].count);
let currentAngle=0;const slices=[];const labelData=[];
const svg=document.getElementById('pieSvg');
const infoPanel=document.getElementById('infoPanel');
const legendContainer=document.getElementById('legend');
const tooltip=document.getElementById('tooltip');
const modalOverlay=document.getElementById('modalOverlay');
const modalTitle=document.getElementById('modalTitle');
const modalContent=document.getElementById('modalContent');
const modalClose=document.getElementById('modalClose');

entries.forEach(([name,item])=>{
  const angle=(item.count/totalCount)*360;
  const sA=currentAngle,eA=currentAngle+angle;
  const sR=((sA-90)*Math.PI)/180,eR=((eA-90)*Math.PI)/180;
  const x1=CX+R*Math.cos(sR),y1=CY+R*Math.sin(sR);
  const x2=CX+R*Math.cos(eR),y2=CY+R*Math.sin(eR);
  const la=angle>180?1:0;
  const d=`M ${CX} ${CY} L ${x1} ${y1} A ${R} ${R} 0 ${la} 1 ${x2} ${y2} Z`;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d);path.setAttribute('fill',item.color);
  path.setAttribute('stroke','#fff');path.setAttribute('stroke-width','1.5');
  path.setAttribute('class','pie-slice');path.setAttribute('data-name',name);
  path.addEventListener('mouseenter',()=>{tooltip.textContent=`${name}：${item.count}题 (${((item.count/totalCount)*100).toFixed(1)}%)`;tooltip.classList.add('show');});
  path.addEventListener('mousemove',(e)=>{tooltip.style.left=e.clientX+14+'px';tooltip.style.top=e.clientY-10+'px';});
  path.addEventListener('mouseleave',()=>tooltip.classList.remove('show'));
  path.addEventListener('click',()=>selectSlice(name));
  svg.appendChild(path);slices.push(path);

  const midAngle=(sA+eA)/2-90;
  const midRad=midAngle*Math.PI/180;
  const cos=Math.cos(midRad),sin=Math.sin(midRad);
  const lsX=CX+R*cos,lsY=CY+R*sin;
  const bendR=R+22;
  const bX=CX+bendR*cos,bY=CY+bendR*sin;
  const isRight=cos>=0;
  const horizLen=isRight?28:-28;
  const eX=bX+horizLen;
  labelData.push({name,count:item.count,color:item.color,shortName:item.shortName,isRight,lsX,lsY,bX,bY,eX,y:bY});

  const li=document.createElement('div');
  li.className='legend-item';li.setAttribute('data-name',name);
  li.innerHTML=`<span class="legend-color" style="background:${item.color}"></span><span>${name}</span><span class="legend-count">${item.count}题</span>`;
  li.addEventListener('click',()=>selectSlice(name));
  legendContainer.appendChild(li);
  currentAngle=eA;
});

const leftLabels=labelData.filter(l=>!l.isRight);
const rightLabels=labelData.filter(l=>l.isRight);
function layoutLabels(arr,top,bottom,minGap){
  if(arr.length===0)return;
  arr.sort((a,b)=>a.y-b.y);
  for(let i=1;i<arr.length;i++){if(arr[i].y-arr[i-1].y<minGap)arr[i].y=arr[i-1].y+minGap;}
  if(arr[arr.length-1].y>bottom){arr[arr.length-1].y=bottom;for(let i=arr.length-2;i>=0;i--){if(arr[i+1].y-arr[i].y<minGap)arr[i].y=arr[i+1].y-minGap;}}
  if(arr[0].y<top){arr[0].y=top;for(let i=1;i<arr.length;i++){if(arr[i].y-arr[i-1].y<minGap)arr[i].y=arr[i-1].y+minGap;}}
}
layoutLabels(leftLabels,40,460,24);
layoutLabels(rightLabels,40,460,24);

labelData.forEach(l=>{
  const polyline=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  polyline.setAttribute('points',`${l.lsX},${l.lsY} ${l.bX},${l.bY} ${l.eX},${l.y}`);
  polyline.setAttribute('fill','none');polyline.setAttribute('stroke',l.color);
  polyline.setAttribute('stroke-width','1.2');polyline.setAttribute('stroke-linejoin','round');
  polyline.setAttribute('opacity','0.9');polyline.setAttribute('class','label-line');

  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','label-group');
  g.addEventListener('click',()=>selectSlice(l.name));
  const textX=l.isRight?l.eX+4:l.eX-4;
  const anchor=l.isRight?'start':'end';

  const nameText=document.createElementNS('http://www.w3.org/2000/svg','text');
  nameText.setAttribute('x',textX);nameText.setAttribute('y',l.y-3);
  nameText.setAttribute('text-anchor',anchor);nameText.setAttribute('font-size','9');
  nameText.setAttribute('font-weight','700');nameText.setAttribute('fill',l.color);
  nameText.setAttribute('font-family','system-ui, sans-serif');nameText.textContent=l.shortName;
  g.appendChild(nameText);

  const pctText=document.createElementNS('http://www.w3.org/2000/svg','text');
  pctText.setAttribute('x',textX);pctText.setAttribute('y',l.y+9);

});

// ============ 选中专题 ============
function selectSlice(name){
  slices.forEach(s=>s.classList.toggle('active',s.getAttribute('data-name')===name));
  document.querySelectorAll('.legend-item').forEach(el=>el.classList.toggle('active',el.getAttribute('data-name')===name));
  const item=data[name];if(!item)return;
  let html=`<h2>📌 ${name} <span style="font-size:0.9rem;font-weight:400;color:#64748b;">(${item.count}题 · 占比 ${((item.count/totalCount)*100).toFixed(1)}%)</span></h2>`;
  const yearOrder=['2022','2023','2024','2025秋','2025培训','2026'];
  let hasAny=false;
  yearOrder.forEach(year=>{
    const qs=item.questions[year];
    if(qs&&qs.length>0){
      hasAny=true;
      html+=`<div class="year-group"><div class="year-label">📅 ${year} <span class="badge">${qs.length}题</span></div><div class="q-list">`;
      qs.forEach(q=>{
        const st=answerState[`${year}_${q}`];
        const cls=st?(st.status==='correct'?'correct':'wrong'):'';
        html+=`<span class="q-item ${cls}" data-year="${year}" data-q="${q}" onclick="showQuestion('${year}',${q})">第${q}题</span>`;
      });
      html+=`</div></div>`;
    }
  });
  if(!hasAny)html+=`<div style="color:#94a3b8;padding:20px 0;text-align:center;">暂无题号数据</div>`;
  infoPanel.innerHTML=html;
}

function escapeHtml(text){const d=document.createElement('div');d.textContent=text;return d.innerHTML;}

// ============ 弹窗答题 ============
window.showQuestion=function(year,q){
  const yd=questionDB[year];
  const content=yd?yd[q]:null;
  modalTitle.textContent=`📖 ${year} 第${q}题`;
  if(!content){
    modalContent.innerHTML='<span style="color:#94a3b8;font-style:italic;">📭 该题目的详细内容暂未收录。</span>';
    modalOverlay.classList.add('show');
    return;
  }
  const m=content.match(/答案[：:]/);
  let qp=content,ap='';
  if(m){const idx=m.index;qp=content.substring(0,idx).trim();ap=content.substring(idx+m[0].length).trim();}
  const st=answerState[`${year}_${q}`];

  let html=`<div class="question-text">${escapeHtml(qp)}</div>`;
  html+=`<div class="answer-input-area">
    <input type="text" id="answerInput" placeholder="请输入你的答案..." value="${st?escapeHtml(st.userAnswer):''}">
    <button id="submitBtn">提交答案</button>
  </div>`;
  html+=`<div class="feedback-area" id="feedbackArea"></div>`;
  html+=`<button class="show-answer-btn" id="showAnswerBtn">👁️ 查看标准答案</button>`;
  html+=`<div class="answer-box" id="answerBox" style="display:none;">
    <div class="answer-label">📝 标准答案</div>
    <div class="answer-text">${escapeHtml(ap||'（无）')}</div>
  </div>`;

  modalContent.innerHTML=html;
  modalOverlay.classList.add('show');

  const showBtn=document.getElementById('showAnswerBtn');
  const answerBox=document.getElementById('answerBox');
  showBtn.addEventListener('click',()=>{
    if(answerBox.style.display==='none'){answerBox.style.display='block';showBtn.textContent='🙈 隐藏标准答案';}
    else{answerBox.style.display='none';showBtn.textContent='👁️ 查看标准答案';}
  });

  const input=document.getElementById('answerInput');
  const submitBtn=document.getElementById('submitBtn');
  const feedback=document.getElementById('feedbackArea');

  if(st){
    feedback.className='feedback-area show '+(st.status==='correct'?'correct':'wrong');
    feedback.textContent=st.status==='correct'?'✅ 回答正确！':'❌ 回答错误，请重试或查看标准答案。';
  }

  submitBtn.addEventListener('click',()=>{
    const userVal=input.value.trim();
    if(!userVal){
      feedback.className='feedback-area show wrong';
      feedback.textContent='⚠️ 请先输入答案再提交。';
      return;
    }
    const correct=isAnswerMatch(userVal,ap);
    answerState[`${year}_${q}`]={status:correct?'correct':'wrong',userAnswer:userVal};
    saveState();// 保存到本地
    feedback.className='feedback-area show '+(correct?'correct':'wrong');
    feedback.textContent=correct?'✅ 回答正确！':'❌ 回答错误，请重试或查看标准答案。';
    updateStats();
    const el=document.querySelector(`.q-item[data-year="${year}"][data-q="${q}"]`);
    if(el){el.classList.remove('correct','wrong');el.classList.add(correct?'correct':'wrong');}
  });

  input.addEventListener('keydown',e=>{if(e.key==='Enter')submitBtn.click();});
  input.focus();
};

modalClose.addEventListener('click',()=>modalOverlay.classList.remove('show'));
modalOverlay.addEventListener('click',e=>{if(e.target===modalOverlay)modalOverlay.classList.remove('show');});

      } else {
        sd.textContent = `${c} / ${totalQuestions} 分`;
        sd.style.background = '#eef2ff'; sd.style.color = '#4F46E5';
      }
      document.querySelectorAll('.q-item').forEach(el => {
        const y = el.getAttribute('data-year'), q = el.getAttribute('data-q');
        if (!y || !q) return;
        const st = answerState[`${y}_${q}`];
        el.classList.remove('correct', 'wrong');
        if (st && st.status === 'correct') el.classList.add('correct');
        else if (st && st.status === 'wrong') el.classList.add('wrong');
      });
    }

    // ---- 绘制饼图 ----
    const totalCount = Object.values(data).reduce((s, i) => s + i.count, 0);
    const svg = document.getElementById('pieSvg');
    const infoPanel = document.getElementById('infoPanel');
    const legendContainer = document.getElementById('legend');
    const tooltip = document.getElementById('tooltip');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalContent = document.getElementById('modalContent');
    const modalClose = document.getElementById('modalClose');

    if (!svg) { console.error('未找到 #pieSvg'); return; }

    const CX = 250, CY = 250, R = 130;
    const entries = Object.entries(data).sort((a, b) => b[1].count - a[1].count);
    let currentAngle = 0;
    const slices = [];
    const labelData = [];

    entries.forEach(([name, item]) => {
      const angle = (item.count / totalCount) * 360;
      const sA = currentAngle, eA = currentAngle + angle;
      const sR = ((sA - 90) * Math.PI) / 180, eR = ((eA - 90) * Math.PI) / 180;
      const x1 = CX + R * Math.cos(sR), y1 = CY + R * Math.sin(sR);
      const x2 = CX + R * Math.cos(eR), y2 = CY + R * Math.sin(eR);
      const la = angle > 180 ? 1 : 0;
      const d = `M ${CX} ${CY} L ${x1} ${y1} A ${R} ${R} 0 ${la} 1 ${x2} ${y2} Z`;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', item.color);
      path.setAttribute('stroke', '#fff');
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('class', 'pie-slice');
      path.setAttribute('data-name', name);
      path.addEventListener('mouseenter', () => {
        tooltip.textContent = `${name}：${item.count}题 (${((item.count / totalCount) * 100).toFixed(1)}%)`;
        tooltip.classList.add('show');
      });
      path.addEventListener('mousemove', e => {
        tooltip.style.left = e.clientX + 14 + 'px';
        tooltip.style.top = e.clientY - 10 + 'px';
      });
      path.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
      path.addEventListener('click', () => selectSlice(name));
      svg.appendChild(path);
      slices.push(path);

      const midAngle = (sA + eA) / 2 - 90;
      const midRad = midAngle * Math.PI / 180;
      const cos = Math.cos(midRad), sin = Math.sin(midRad);
      const lsX = CX + R * cos, lsY = CY + R * sin;
      const bendR = R + 22;
      const bX = CX + bendR * cos, bY = CY + bendR * sin;
      const isRight = cos >= 0;
      const eX = bX + (isRight ? 28 : -28);
      labelData.push({ name, count: item.count, color: item.color, shortName: item.shortName, isRight, lsX, lsY, bX, bY, eX, y: bY });

      const li = document.createElement('div');
      li.className = 'legend-item';
      li.setAttribute('data-name', name);
      li.innerHTML = `<span class="legend-color" style="background:${item.color}"></span><span>${name}</span><span class="legend-count">${item.count}题</span>`;
      li.addEventListener('click', () => selectSlice(name));
      legendContainer.appendChild(li);

      currentAngle = eA;
    });

    // 标签防重叠
    const leftLabels = labelData.filter(l => !l.isRight);
    const rightLabels = labelData.filter(l => l.isRight);
    function layoutLabels(arr, top, bottom, gap) {
      if (!arr.length) return;
      arr.sort((a, b) => a.y - b.y);
      for (let i = 1; i < arr.length; i++) if (arr[i].y - arr[i - 1].y < gap) arr[i].y = arr[i - 1].y + gap;
      if (arr[arr.length - 1].y > bottom) {
        arr[arr.length - 1].y = bottom;
        for (let i = arr.length - 2; i >= 0; i--) if (arr[i + 1].y - arr[i].y < gap) arr[i].y = arr[i + 1].y - gap;
      }
      if (arr[0].y < top) {
        arr[0].y = top;
        for (let i = 1; i < arr.length; i++) if (arr[i].y - arr[i - 1].y < gap) arr[i].y = arr[i - 1].y + gap;
      }
    }
    layoutLabels(leftLabels, 40, 460, 24);
    layoutLabels(rightLabels, 40, 460, 24);

    labelData.forEach(l => {
      const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      pl.setAttribute('points', `${l.lsX},${l.lsY} ${l.bX},${l.bY} ${l.eX},${l.y}`);
      pl.setAttribute('fill', 'none');
      pl.setAttribute('stroke', l.color);
      pl.setAttribute('stroke-width', '1.2');
      pl.setAttribute('stroke-linejoin', 'round');
      pl.setAttribute('opacity', '0.9');
      pl.setAttribute('class', 'label-line');
      pl.addEventListener('click', () => selectSlice(l.name));
      svg.appendChild(pl);

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'label-group');
      g.addEventListener('click', () => selectSlice(l.name));
      const tx = l.isRight ? l.eX + 4 : l.eX - 4;
      const anchor = l.isRight ? 'start' : 'end';

      const nt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      nt.setAttribute('x', tx); nt.setAttribute('y', l.y - 3);
      nt.setAttribute('text-anchor', anchor); nt.setAttribute('font-size', '9');
      nt.setAttribute('font-weight', '700'); nt.setAttribute('fill', l.color);
      nt.setAttribute('font-family', 'system-ui, sans-serif');
      nt.textContent = l.shortName;
      g.appendChild(nt);

      const pt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      pt.setAttribute('x', tx); pt.setAttribute('y', l.y + 9);
      pt.setAttribute('text-anchor', anchor); pt.setAttribute('font-size', '8');
      pt.setAttribute('font-weight', '500'); pt.setAttribute('fill', '#64748b');
      pt.setAttribute('font-family', 'system-ui, sans-serif');
      pt.textContent = `${l.count}题 · ${((l.count / totalCount) * 100).toFixed(1)}%`;
      g.appendChild(pt);

      svg.appendChild(g);
    });

    // ---- 选中专题 ----
    function selectSlice(name) {
      slices.forEach(s => s.classList.toggle('active', s.getAttribute('data-name') === name));
      document.querySelectorAll('.legend-item').forEach(el => el.classList.toggle('active', el.getAttribute('data-name') === name));
      const item = data[name];
      if (!item) return;
      let html = `<h2>📌 ${name} <span style="font-size:0.9rem;font-weight:400;color:#64748b;">(${item.count}题 · 占比 ${((item.count / totalCount) * 100).toFixed(1)}%)</span></h2>`;
      const years = ['2022', '2023', '2024', '2025秋', '2025培训', '2026'];
      let has = false;
      years.forEach(year => {
        const qs = item.questions[year];
        if (qs && qs.length) {
          has = true;
          html += `<div class="year-group"><div class="year-label">📅 ${year} <span class="badge">${qs.length}题</span></div><div class="q-list">`;
          qs.forEach(q => {
            const st = answerState[`${year}_${q}`];
            const cls = st ? (st.status === 'correct' ? 'correct' : 'wrong') : '';
            html += `<span class="q-item ${cls}" data-year="${year}" data-q="${q}" onclick="showQuestion('${year}',${q})">第${q}题</span>`;
          });
          html += `</div></div>`;
        }
      });
      if (!has) html += `<div style="color:#94a3b8;padding:20px 0;text-align:center;">暂无题号数据</div>`;
      infoPanel.innerHTML = html;
    }

    // ---- 弹窗 ----
function saveState() {
  try {
    localStorage.setItem('hope_cup_answer_state_v1', JSON.stringify(answerState));
  } catch (e) {
    console.warn('保存失败', e);
  }
}
    window.showQuestion = function (year, q) {
  const yd = questionDB[year];
  const raw = yd ? yd[q] : null;

  // 兼容「纯字符串」和「{text, img}」两种格式
  const content = typeof raw === 'string' ? raw : (raw ? raw.text : null);
  const imgPath = (raw && typeof raw === 'object' && raw.img) ? raw.img : null;

  modalTitle.textContent = `📖 ${year} 第${q}题`;

  if (!content) {
    modalContent.innerHTML = '<span style="color:#94a3b8;font-style:italic;">📭 该题目的详细内容暂未收录。</span>';
    modalOverlay.classList.add('show');
    return;
  }

  const m = content.match(/答案[：:]/);
  let qp = content, ap = '';
  if (m) {
    qp = content.substring(0, m.index).trim();
    ap = content.substring(m.index + m[0].length).trim();
  }

  const st = answerState[`${year}_${q}`];

  let html = `<div class="question-text">${escapeHtml(qp)}</div>`;

  // 新增：有配图则渲染
  if (imgPath) {
    html += `<div class="question-image">
      <img src="${imgPath}" alt="第${q}题配图"
           onerror="this.parentElement.innerHTML='<div class=\\'img-missing\\'>📷 图片未找到：${imgPath}</div>'">
    </div>`;
  }

  html += `<div class="answer-input-area">
    <input type="text" id="answerInput" placeholder="请输入你的答案..." value="${st ? escapeHtml(st.userAnswer) : ''}">
    <button id="submitBtn">提交答案</button>
  </div>`;
  html += `<div class="feedback-area" id="feedbackArea"></div>`;
  html += `<button class="show-answer-btn" id="showAnswerBtn">👁️ 查看标准答案</button>`;
  html += `<div class="answer-box" id="answerBox" style="display:none;">
    <div class="answer-label">📝 标准答案</div>
    <div class="answer-text">${escapeHtml(ap || '（无）')}</div>
  </div>`;

  modalContent.innerHTML = html;
  modalOverlay.classList.add('show');

  const showBtn = document.getElementById('showAnswerBtn');
  const answerBox = document.getElementById('answerBox');
  showBtn.addEventListener('click', () => {
    if (answerBox.style.display === 'none') {
      answerBox.style.display = 'block';
      showBtn.textContent = '🙈 隐藏标准答案';
    } else {
      answerBox.style.display = 'none';
      showBtn.textContent = '👁️ 查看标准答案';
    }
  });

  const input = document.getElementById('answerInput');
  const submitBtn = document.getElementById('submitBtn');
  const feedback = document.getElementById('feedbackArea');

  if (st) {
    feedback.className = 'feedback-area show ' + (st.status === 'correct' ? 'correct' : 'wrong');
    feedback.textContent = st.status === 'correct' ? '✅ 回答正确！' : '❌ 回答错误，请重试或查看标准答案。';
  }

  submitBtn.addEventListener('click', () => {
    const userVal = input.value.trim();
    if (!userVal) {
      feedback.className = 'feedback-area show wrong';
      feedback.textContent = '⚠️ 请先输入答案再提交。';
      return;
    }
    const correct = isAnswerMatch(userVal, ap);
    answerState[`${year}_${q}`] = { status: correct ? 'correct' : 'wrong', userAnswer: userVal };
    saveState();
    feedback.className = 'feedback-area show ' + (correct ? 'correct' : 'wrong');
    feedback.textContent = correct ? '✅ 回答正确！' : '❌ 回答错误，请重试或查看标准答案。';
    updateStats();
    const el = document.querySelector(`.q-item[data-year="${year}"][data-q="${q}"]`);
    if (el) {
      el.classList.remove('correct', 'wrong');
      el.classList.add(correct ? 'correct' : 'wrong');
    }
  });

  input.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });
  input.focus();
};

    modalClose.addEventListener('click', () => modalOverlay.classList.remove('show'));
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) modalOverlay.classList.remove('show'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') modalOverlay.classList.remove('show'); });

    // ---- 重置 ----
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('确定要清空所有做题记录吗？此操作不可恢复。')) {
        answerState = {};
        saveState();
        updateStats();
        const active = document.querySelector('.legend-item.active');
        if (active) selectSlice(active.getAttribute('data-name'));
      }
    });

    // ---- 初始化 ----
    if (entries[0]) selectSlice(entries[0][0]);
    updateStats();

  } catch (err) {
    console.error('初始化失败：', err);
    // 在页面上显示错误，避免"一片空白"
    const box = document.querySelector('.chart-container');
    if (box) box.insertAdjacentHTML('afterbegin',
      `<div style="width:100%;padding:16px;background:#fee2e2;color:#991b1b;border-radius:10px;margin-bottom:12px;font-size:.9rem;">
        ⚠️ 脚本运行出错：${err.message}<br>请打开 F12 控制台查看详情。
      </div>`);
  }
});
</script>
